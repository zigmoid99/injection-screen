[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "injscreen"
version = "0.1.0"
description = "Heuristic screening for indirect prompt injection in untrusted text"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
injscreen = "injscreen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
